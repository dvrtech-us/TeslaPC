<html>

<head>
    <title>Remote Desktop</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="/style.css" />
</head>

<body>

    <img title="playback" style="width: 100%" src="http://LOCALHOST:8081" />
    <br />
    <!-- <div style="margin: 10px;"> <button onclick="startAudioPlayback()" id="startPlayback" class="button"> Start
            playback</button> </div>

     Include the WebSocket JavaScript library -->

    <div style="margin: 10px; width: 100%">

        <input type="text" id="fakeKeyboard" class="button" placeholder="Open Keyboard" /> <button class="button"
                                                                                                   onclick="focus()">
            Close Keyboard
        </button>


        <button class="button pad"
                onclick="window.location.assign('http://LOCALHOST:8080/list.html')">
           Play Video
        </button>
    </div>


    <script>

        let audioContext = null
        let audioSocket = null;
        var audioSource = null;
        let pcmPlayerNode = null;

        async function startAudioPlaybackold() {
            if (audioContext != null) {
                return;
            }
            console.log('Before AudioContext start');

            audioContext = new AudioContext({ sampleRate: 48000, channels: 2, latencyHint: 'interactive' });
            console.log('After AudioContext start');

            await audioContext.audioWorklet.addModule('PCMPlayerProcessor.js');
            console.log("starting audioContext");
            var pcmPlayerNode = new AudioWorkletNode(audioContext, 'pcm-player-processor', { outputChannelCount: [2] });
            var audioSocket = new WebSocket('ws://LOCALHOST:8082/');
            audioSocket.binaryType = 'arraybuffer'
            pcmPlayerNode.connect(audioContext.destination);
            audioSocket.onmessage = function (event) {


                pcmPlayerNode.port.postMessage(event.data);
            };
            audioContext.resume();
            console.log('after AudioContext resume');
            var startPlaybackButton = document.getElementById('startPlayback');
            //change the button text
            startPlaybackButton.innerHTML = 'Restart playback';



        }
        var totalDuration = 0;
        async function startAudioPlayback() {
            if (audioContext == null) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                audioSource = audioContext.createBufferSource();
                audioSocket = new WebSocket('ws://LOCALHOST:8082/');
                audioSocket.binaryType = 'arraybuffer';
                audioSocket.onmessage = function (event) {
                    var audioData = new Float32Array(event.data);
                    var buffer = audioContext.createBuffer(1, audioData.length, audioContext.sampleRate);
                    buffer.copyToChannel(audioData, 0);
                    var source = audioContext.createBufferSource();
                    source.buffer = buffer;
                    source.connect(audioContext.destination);
                    source.start(totalDuration); // Schedule to play after previous buffer
                    totalDuration += buffer.duration; // Update total duration
                };
            }
        }


        // Create a WebSocket connection
        var mouseSocket = new WebSocket('ws://LOCALHOST:8080/ws/');

        // Get the image element
        var img = document.querySelector('img');

        function sendOrReopenAndSend(data) {
            if (mouseSocket.readyState === WebSocket.OPEN) {
                mouseSocket.send(data);
            } else {
                console.log('Reopening socket');
                console.log(data);
                mouseSocket = new WebSocket('ws://LOCALHOST:8080/ws/');
                mouseSocket.onopen = function () {

                    mouseSocket.send(data);
                };
            }
        }

        // Add an event listener for the 'click' event
        img.addEventListener('click', function (event) {
            // Get the click coordinates relative to the image
            var rect = img.getBoundingClientRect();
            var x = event.clientX - rect.left;
            var y = event.clientY - rect.top;
            //take into account the image size vs the actual size
            //convert to integer
            x = parseInt(x);
            y = parseInt(y);

            // Send these coordinates over the WebSocket connection
            sendOrReopenAndSend(JSON.stringify({
                Type: 'click',
                X: x,
                Y: y,
                DisplaySize: {
                    width: img.width,
                    height: img.height
                }
            }));

        });

        //add an event listener for the 'mousemove' event
        img.addEventListener('mousemove', function (event) {

            // Get the click coordinates relative to the image
            var rect = img.getBoundingClientRect();
            var x = event.clientX - rect.left;
            var y = event.clientY - rect.top;
            //take into account the image size vs the actual size
            //convert to integer
            x = parseInt(x);
            y = parseInt(y);

            // Send these coordinates over the WebSocket connection
            sendOrReopenAndSend(JSON.stringify({
                Type: 'move',
                X: x,
                Y: y,
                DisplaySize: {
                    width: img.width,
                    height: img.height
                }
            }));

        });
        //Add event for mouse down
        img.addEventListener('mousedown', function (event) {
            return;
            // Get the click coordinates relative to the image
            var rect = img.getBoundingClientRect();
            var x = event.clientX - rect.left;
            var y = event.clientY - rect.top;
            //take into account the image size vs the actual size
            //convert to integer
            x = parseInt(x);
            y = parseInt(y);

            // Send these coordinates over the WebSocket connection
            sendOrReopenAndSend(JSON.stringify({
                Type: 'down',
                X: x,
                Y: y,
                DisplaySize: {
                    width: img.width,
                    height: img.height
                }
            }));

        });
        //Add event for mouse up
        img.addEventListener('mouseup', function (event) {

            // Get the click coordinates relative to the image
            var rect = img.getBoundingClientRect();
            var x = event.clientX - rect.left;
            var y = event.clientY - rect.top;
            //take into account the image size vs the actual size
            //convert to integer
            x = parseInt(x);
            y = parseInt(y);

            // Send these coordinates over the WebSocket connection
            sendOrReopenAndSend(JSON.stringify({
                Type: 'up',
                X: x,
                Y: y,
                DisplaySize: {
                    width: img.width,
                    height: img.height
                }
            }));

        });

        //handle touch events
        img.addEventListener('touchstart', function (event) {
            // Get the click coordinates relative to the image
            var rect = img.getBoundingClientRect();
            var x = event.touches[0].clientX - rect.left;
            var y = event.touches[0].clientY - rect.top;
            //take into account the image size vs the actual size
            //convert to integer
            x = parseInt(x);
            y = parseInt(y);

            // Send these coordinates over the WebSocket connection
            sendOrReopenAndSend(JSON.stringify({
                Type: 'down',
                X: x,
                Y: y,
                DisplaySize: {
                    width: img.width,
                    height: img.height
                }
            }));

        });

        img.addEventListener('touchend', function (event) {
            // Get the click coordinates relative to the image
            var rect = img.getBoundingClientRect();
            var x = event.changedTouches[0].clientX - rect.left;
            var y = event.changedTouches[0].clientY - rect.top;
            //take into account the image size vs the actual size
            //convert to integer
            x = parseInt(x);
            y = parseInt(y);

            // Send these coordinates over the WebSocket connection
            sendOrReopenAndSend(JSON.stringify({
                Type: 'up',
                X: x,
                Y: y,
                DisplaySize: {
                    width: img.width,
                    height: img.height
                }
            }));

        });

        img.addEventListener('touchmove', function (event) {
            // Get the click coordinates relative to the image
            var rect = img.getBoundingClientRect();
            var x = event.touches[0].clientX - rect.left;
            var y = event.touches[0].clientY - rect.top;
            //take into account the image size vs the actual size
            //convert to integer
            x = parseInt(x);
            y = parseInt(y);

            // Send these coordinates over the WebSocket connection
            sendOrReopenAndSend(JSON.stringify({
                Type: 'move',
                X: x,
                Y: y,
                DisplaySize: {
                    width: img.width,
                    height: img.height
                }
            }));

        });

        //handle keyboard events
        document.getElementById('fakeKeyboard').addEventListener('keyup', function (event) {
            // Send numeric and chars
            console.log('Key up event');
            console.log(event);
            sendOrReopenAndSend(JSON.stringify({
                Type: 'keyup',
                Key: event.key,
                KeyCode: event.code
            }));
            //prevent default behavior
            event.preventDefault();

        });
        document.getElementById('fakeKeyboard').addEventListener('keypress', function (event) {
            // Send non-numeric
            console.log('keypress');
            console.log(event);

            sendOrReopenAndSend(JSON.stringify({
                Type: 'keypress',
                Key: event.key,
                KeyCode: event.code
            }));
            //prevent default behavior
            event.preventDefault();

        });




    </script>
</body>

</html>
